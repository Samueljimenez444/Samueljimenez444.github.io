<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Serialización/Deserialización</title>
    <script>
        function serializar() {
            const persona = {
                nombre: "Juan",
                apellidos: "Pérez Gómez",
                edad: 30,
                ciudad: "Madrid"
            };
            const json = JSON.stringify(persona);
            document.getElementById("jsonOutput").textContent = json;
            console.log("JSON Serializado:", json);
        }


        function deserializar() {
            const json = document.getElementById("jsonOutput").textContent;
            if (json) {
                const objeto = JSON.parse(json);
                document.getElementById("nombre").textContent = objeto.nombre;
                document.getElementById("apellidos").textContent = objeto.apellidos;
                document.getElementById("edad").textContent = objeto.edad;
                document.getElementById("ciudad").textContent = objeto.ciudad;
                console.log("Objeto Deserializado:", objeto);
            } else {
                alert("No hay JSON para deserializar");
            }
        }
    </script>
</head>
<body>
    <h1>Conversión entre Objeto y JSON</h1>
    <button onclick="serializar()">Serializar</button>
    <button onclick="deserializar()">Deserializar</button>
    <h2>JSON:</h2>
    <p id="jsonOutput" style="white-space: pre-wrap; background: #f4f4f4; padding: 10px;"></p>
    <h2>Datos en Tabla:</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Edad</th>
                <th>Ciudad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td id="nombre"></td>
                <td id="apellidos"></td>
                <td id="edad"></td>
                <td id="ciudad"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
