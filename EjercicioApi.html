<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Api Perros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { text-align: 
            center; 
            padding: 20px; 
        }
        img { max-width: 100%; 
            height: auto; 
            margin-top: 20px; 
            border-radius: 10px; 
        }
        .container { max-width: 600px; 
            margin: auto; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Perros por el mundo</h1>
        <button id="aleatorio" class="btn btn-primary mb-3">Perro Aleatorio</button>
        <select id="raza" class="form-select mb-3"></select>
        <img id="imagenPerro" src="" alt="Imagen de perro">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const aleatorio = document.getElementById("aleatorio");
            const raza = document.getElementById("raza");
            const imagenPerro = document.getElementById("imagenPerro");
            fetch("https://dog.ceo/api/breeds/list/all")
                .then(response => response.json())
                .then(data => {
                    const breeds = data.message;
                    for (const breed in breeds) {
                        if (breeds[breed].length === 0) {
                            raza.innerHTML += `<option value="${breed}">${breed}</option>`;
                        } else {
                            breeds[breed].forEach(subBreed => {
                                raza.innerHTML += `<option value="${breed}/${subBreed}">${subBreed} ${breed}</option>`;
                            });
                        }
                    }
                });

            aleatorio.addEventListener("click", () => {
                fetch("https://dog.ceo/api/breeds/image/random")
                    .then(response => response.json())
                    .then(data => {
                        imagenPerro.src = data.message;
                    });
            });


            raza.addEventListener("change", () => {
                const selectedBreed = raza.value;
                if (selectedBreed) {
                    fetch(`https://dog.ceo/api/breed/${selectedBreed}/images/random`)
                        .then(response => response.json())
                        .then(data => {
                            imagenPerro.src = data.message;
                        });
                }
            });
        });
    </script>
</body>
</html>
