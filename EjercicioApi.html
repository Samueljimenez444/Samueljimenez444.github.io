<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perros Aleatorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { text-align: center; padding: 20px; }
        img { max-width: 100%; height: auto; margin-top: 20px; border-radius: 10px; }
        .container { max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Perros Aleatorios</h1>
        <button id="randomBtn" class="btn btn-primary mb-3">Aleatorio</button>
        <select id="breedSelector" class="form-select mb-3"></select>
        <img id="dogImage" src="" alt="Imagen de perro">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const randomBtn = document.getElementById("randomBtn");
            const breedSelector = document.getElementById("breedSelector");
            const dogImage = document.getElementById("dogImage");

            // Cargar la lista de razas
            fetch("https://dog.ceo/api/breeds/list/all")
                .then(response => response.json())
                .then(data => {
                    const breeds = data.message;
                    for (const breed in breeds) {
                        if (breeds[breed].length === 0) {
                            breedSelector.innerHTML += `<option value="${breed}">${breed}</option>`;
                        } else {
                            breeds[breed].forEach(subBreed => {
                                breedSelector.innerHTML += `<option value="${breed}/${subBreed}">${subBreed} ${breed}</option>`;
                            });
                        }
                    }
                });

            // Cargar imagen aleatoria
            randomBtn.addEventListener("click", () => {
                fetch("https://dog.ceo/api/breeds/image/random")
                    .then(response => response.json())
                    .then(data => {
                        dogImage.src = data.message;
                    });
            });

            // Cambiar imagen al seleccionar raza
            breedSelector.addEventListener("change", () => {
                const selectedBreed = breedSelector.value;
                if (selectedBreed) {
                    fetch(`https://dog.ceo/api/breed/${selectedBreed}/images/random`)
                        .then(response => response.json())
                        .then(data => {
                            dogImage.src = data.message;
                        });
                }
            });
        });
    </script>
</body>
</html>
