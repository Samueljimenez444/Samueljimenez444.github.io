<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro con jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Formulario de Registro</h2>
<form id="formulario">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" ><br><br>
    
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" ><br><br>
    
    <label for="ciudad">Ciudad:</label>
    <input type="text" id="ciudad" name="ciudad" ><br><br>
    
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" ><br><br>
    
    <input type="submit" value="Registrar">
</form>

<table id="tabladatos">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Ciudad</th>
            <th>Edad</th>
        </tr>
    </thead>
    <tbody>
        
    </tbody>
</table>

<script>
    let array={};
    let media;
    let suma;
    let maxima;
    let minima;
    $(document).ready(function() {
        $('#formulario').on('submit', function(event) {
            event.preventDefault(); 

            
            const nombre = $('#nombre').val();
            const apellido = $('#apellido').val();
            const ciudad = $('#ciudad').val();
            const edad = $('#edad').val();

            if(nombre==""){
                 alert("El campo 1 esta vacio");
                            }
                            if(apellido==""){
                                alert("El campo 2 esta vacio");
                            }
                            if(ciudad==""){
                                alert("El campo 3 esta vacio");
                            }
                            if(edad==""){
                                alert("El campo 4 esta vacio");
                            }
            const newRow = `<tr id="1" onclick="eliminarFila(1)">
                                <td>${nombre}</td>
                                <td>${apellido}</td>
                                <td>${ciudad}</td>
                                <td>${edad}</td>
                            </tr>`;
                          
if(nombre!="" && apellido!="" && ciudad!="" && edad!=""){
             $('#tabladatos tbody').append(newRow);
                        
       
             $('#formulario')[0].reset();
                            }
           
        });
    });
</script>

</body>
</html>
