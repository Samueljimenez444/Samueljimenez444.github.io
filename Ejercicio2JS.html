<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro con jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Formulario de Registro</h2>
<form id="formulario">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" ><br><br>
    
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" ><br><br>
    
    <label for="ciudad">Ciudad:</label>
    <input type="text" id="ciudad" name="ciudad" ><br><br>
    
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" ><br><br>
    
    <input type="submit" value="Registrar">
</form>

<table id="tabladatos">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Ciudad</th>
            <th>Edad</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        
    </tbody>
</table>

<script>
    let registros = []; // Array para almacenar los registros
    let idCounter = 1; // Contador para asignar IDs únicos

    $(document).ready(function() {
        $('#formulario').on('submit', function(event) {
            event.preventDefault(); 

            const nombre = $('#nombre').val();
            const apellido = $('#apellido').val();
            const ciudad = $('#ciudad').val();
            const edad = $('#edad').val();

            if(nombre === "") {
                alert("El campo 1 está vacío");
                return;
            }
            if(apellido === "") {
                alert("El campo 2 está vacío");
                return;
            }
            if(ciudad === "") {
                alert("El campo 3 está vacío");
                return;
            }
            if(edad === "") {
                alert("El campo 4 está vacío");
                return;
            }

            // Crear un nuevo registro
            const nuevoRegistro = {
                id: idCounter++,
                nombre: nombre,
                apellido: apellido,
                ciudad: ciudad,
                edad: edad
            };

            // Agregar el nuevo registro al array
            registros.push(nuevoRegistro);
            generaTabla(); // Generar la tabla

            $('#formulario')[0].reset(); // Resetear el formulario
        });
    });

    function generaTabla() {
        const tbody = $('#tabladatos tbody');
        tbody.empty(); // Limpiar el tbody antes de regenerar

        // Recorrer los registros y crear las filas
        registros.forEach(registro => {
            const newRow = `<tr id="row-${registro.id}">
                                <td>${registro.nombre}</td>
                                <td>${registro.apellido}</td>
                                <td>${registro.ciudad}</td>
                                <td>${registro.edad}</td>
                                <td><button onclick="eliminarFila(${registro.id})">Eliminar</button></td>
                            </tr>`;
            tbody.append(newRow);
        });
    }

    function eliminarFila(id) {
        // Encontrar el índice del registro a eliminar
        const index = registros.findIndex(registro => registro.id === id);
        if (index !== -1) {
            // Eliminar el registro del array
            registros.splice(index, 1);
            generaTabla(); // Regenerar la tabla
        }
    }
</script>

</body>
</html>
