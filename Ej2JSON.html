<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>HTML</h1>
    <form id="formulario1">
        <label>Nombre</label>
        <input type="text" id="nombre" name="nombre" required ><br><br>
        <label>Apellido</label>
        <input type="text" id="Apellido" name="Apellido" required ><br><br>
        <label>Ciudad</label>
        <input type="text" id="Ciudad" name="Ciudad" required ><br><br>
        <label>Edad</label>
        <input type="text" id="Edad" name="Edad" required ><br><br>
        <input type="submit" value="Enviar">

    </form id="formulario1">
    <table id="tabla">
        <thead>
            <tr>
                <th id="name">Nombre</th>
                <th id="surname">Apellido</th>
                <th id="city">Ciudad</th>
                <th id="age">Edad</th>
            </tr>
            <tbody>

            </tbody>
        </thead>
    </table>
    <script>
         document.getElementById('formulario1').addEventListener('submit', function(event) {
        event.preventDefault(); 

    
        const nombre = document.getElementById('nombre').value;
        const apellidos = document.getElementById('apellidos').value;
        const ciudad = document.getElementById('ciudad').value;
        const edad = document.getElementById('edad').value;
         
        const table = document.getElementById('tabla').getElementsByTagName('tbody')[0];
        const newRow = table.insertRow();


        const cell1 = newRow.insertCell(0);
        const cell2 = newRow.insertCell(1);
        const cell3 = newRow.insertCell(2);
        const cell4 = newRow.insertCell(3);

        
        cell1.textContent = nombre;
        cell2.textContent = apellidos;
        cell3.textContent = ciudad;
        cell4.textContent = edad;

   
        document.getElementById('formulario1').reset();
    });
    </script>
</body>
</html>
