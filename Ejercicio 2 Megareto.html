<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Dinámico</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Formulario de Inserción</h1>
    <form id="formulario">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" required>
        <label for="edad">Edad: </label>
        <input type="number" id="edad" required>
        <button type="submit">Añadir</button>
    </form>


    <h2>Lista de Personas</h2>
    <table id="tabla">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>


    <script>

        let filas = [];


    
        function agregarFila(nombre, edad) {
            const id = new Date().getTime();
            const fila = { id, nombre, edad };
            filas.push(fila);
    
            localStorage.setItem('filas', JSON.stringify(filas));
            generaTabla();
        }


        function eliminarFila(id) {

            const index = filas.findIndex(fila => fila.id === id);
            if (index !== -1) {
                filas.splice(index, 1);
                localStorage.setItem('filas', JSON.stringify(filas));
                generaTabla(); 
            }
        }


        
        function generaTabla() {
            
            const filasGuardadas = JSON.parse(localStorage.getItem('filas')) || [];


            const tbody = document.getElementById('tbody');
            tbody.innerHTML = ''; 


            filasGuardadas.forEach(fila => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', fila.id); 


                const tdNombre = document.createElement('td');
                tdNombre.textContent = fila.nombre;
                tr.appendChild(tdNombre);


                const tdEdad = document.createElement('td');
                tdEdad.textContent = fila.edad;
                tr.appendChild(tdEdad);


                const tdAccion = document.createElement('td');
                const btnEliminar = document.createElement('button');
                btnEliminar.textContent = 'Eliminar';
                btnEliminar.onclick = function() {
                    eliminarFila(fila.id); 
                };
                tdAccion.appendChild(btnEliminar);
                tr.appendChild(tdAccion);


                tbody.appendChild(tr);
            });
        }


        
        document.getElementById('formulario').addEventListener('submit', function(event) {
            event.preventDefault(); 


            const nombre = document.getElementById('nombre').value;
            const edad = document.getElementById('edad').value;


            if (nombre && edad) {
                agregarFila(nombre, edad); 
            }


            
            document.getElementById('nombre').value = '';
            document.getElementById('edad').value = '';
        });


        window.onload = function() {
            generaTabla();
        };
    </script>
</body>
</html>
