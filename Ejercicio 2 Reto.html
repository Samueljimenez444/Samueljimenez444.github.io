<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Serialización/Deserialización</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let edades = [];


        function serializar() {
            const nombre = document.getElementById("inputNombre").value;
            const apellidos = document.getElementById("inputApellidos").value;
            const edad = document.getElementById("inputEdad").value;
            const ciudad = document.getElementById("inputCiudad").value;


            if (!nombre) return alert("El campo Nombre es obligatorio");
            if (!apellidos) return alert("El campo Apellidos es obligatorio");
            if (!edad) return alert("El campo Edad es obligatorio");
            if (!ciudad) return alert("El campo Ciudad es obligatorio");


            const persona = { nombre, apellidos, edad: parseInt(edad), ciudad };
            const json = JSON.stringify(persona);
            document.getElementById("jsonOutput").textContent = json;
            console.log("JSON Serializado:", json);
        }


        function deserializar() {
            const json = document.getElementById("jsonOutput").textContent;
            if (json) {
                const objeto = JSON.parse(json);
                document.getElementById("tablaBody").innerHTML += crearFila(objeto);
                edades.push(objeto.edad);
                actualizarEstadisticas();
                console.log("Objeto Deserializado y agregado a la tabla:", objeto);
            } else {
                alert("No hay JSON para deserializar");
            }
        }


        function crearFila(objeto) {
            const idFila = "fila-" + new Date().getTime();
            return `<tr id="${idFila}" onclick="eliminarFila('${idFila}', ${objeto.edad})">
                        <td>${objeto.nombre}</td>
                        <td>${objeto.apellidos}</td>
                        <td>${objeto.edad}</td>
                        <td>${objeto.ciudad}</td>
                    </tr>`;
        }


        function eliminarFila(id, edad) {
            document.getElementById(id).remove();
            edades = edades.filter(e => e !== edad);
            actualizarEstadisticas();
        }


        function actualizarEstadisticas() {
            if (edades.length === 0) {
                document.getElementById("stats").textContent = "No hay datos disponibles";
                return;
            }
            const suma = edades.reduce((a, b) => a + b, 0);
            const media = (suma / edades.length).toFixed(2);
            const max = Math.max(...edades);
            const min = Math.min(...edades);
            document.getElementById("stats").textContent = `Suma: ${suma}, Media: ${media}, Máximo: ${max}, Mínimo: ${min}`;
            console.log("Estadísticas - Suma:", suma, "Media:", media, "Máximo:", max, "Mínimo:", min);
        }
    </script>
</head>
<body>
    <h1>Conversión entre Objeto y JSON</h1>
    <form onsubmit="event.preventDefault(); serializar();">
        <label>Nombre: <input type="text" id="inputNombre"></label>
        <label>Apellidos: <input type="text" id="inputApellidos"></label>
        <label>Edad: <input type="number" id="inputEdad"></label>
        <label>Ciudad: <input type="text" id="inputCiudad"></label>
        <button type="submit">Serializar</button>
    </form>
    <button onclick="deserializar()">Deserializar y Agregar a la Tabla</button>
    <h2>JSON:</h2>
    <p id="jsonOutput" style="white-space: pre-wrap; background: #f4f4f4; padding: 10px;"></p>
    <h2>Datos en Tabla:</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Edad</th>
                <th>Ciudad</th>
            </tr>
        </thead>
        <tbody id="tablaBody">
        </tbody>
    </table>
    <h2>Estadísticas de Edades:</h2>
    <p id="stats">No hay datos disponibles</p>
</body>
</html>
